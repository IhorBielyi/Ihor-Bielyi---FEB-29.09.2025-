<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link rel="stylesheet" href="resources/css/styles.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-close">
        <button class="auth-btn close">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path fill-rule="evenodd" clip-rule="evenodd"
                      d="M3.17007 3.17007C3.39682 2.94331 3.76447 2.94331 3.99122 3.17007L9 8.17884L14.0088 3.17007C14.2355 2.94331 14.6032 2.94331 14.8299 3.17007C15.0567 3.39682 15.0567 3.76447 14.8299 3.99122L9.82116 9L14.8299 14.0088C15.0567 14.2355 15.0567 14.6032 14.8299 14.8299C14.6032 15.0567 14.2355 15.0567 14.0088 14.8299L9 9.82116L3.99122 14.8299C3.76447 15.0567 3.39682 15.0567 3.17007 14.8299C2.94331 14.6032 2.94331 14.2355 3.17007 14.0088L8.17884 9L3.17007 3.99122C2.94331 3.76447 2.94331 3.39682 3.17007 3.17007Z"
                      fill="#46A358"/>
            </svg>
        </button>
    </div>

    <div class="auth-header">
        <a href="#">Login</a>
        <span class="auth-separator">|</span>
        <a href="#" style="color: #46A358">Register</a>
    </div>

    <p>Enter your email and password to register.</p>

    <form class="auth-form" action="#" method="POST">
        <label>
            <input type="text" name="username" placeholder="Username">
        </label>

        <label>
            <input type="email" name="email" placeholder="Enter your email address">
        </label>

        <label class="password-field">
            <input type="password" name="password" placeholder="Password">
            <button type="button" class="password-eye">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="16" viewBox="0 0 18 16" fill="none">
                    <path d="M4.35 12.7748C2.49166 11.5582 1.29166 9.72483 1.29166 8.1165C1.29166 5.38317 4.74166 2.03316 9 2.03316C10.7417 2.03316 12.3583 2.5915 13.6583 3.45816"

                    <path d="M15.5414 5.17517C16.2839 6.11683 16.7164 7.1585 16.7164 8.11683C16.7164 10.8502 13.2581 14.2002 8.99975 14.2002C8.24142 14.2002 7.50058 14.0918 6.80808 13.9002"
                          stroke="#727272" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M7.13808 9.9725C6.64225 9.48167 6.36475 8.8125 6.36725 8.115C6.36392 6.66084 7.54058 5.47917 8.99558 5.47667C9.69558 5.475 10.3673 5.7525 10.8623 6.2475"
                          stroke="#727272" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M11.5912 8.58258C11.3962 9.65925 10.5537 10.5034 9.47708 10.7009" stroke="#727272"
                          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M15.5764 1.54159L2.43142 14.6866" stroke="#727272" stroke-width="1.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </label>

        <label>
            <input type="password" name="password_confirmation" placeholder="Confirm Password">
        </label>

        <button type="submit">Register</button>
    </form>

    <p class="auth-or">Or register with</p>

        <button class="social-btn facebook">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M13.3309 3.32083H15.1567V0.140833C14.8417 0.0975 13.7584 0 12.4967 0C6.72006 0 8.29172 6.54167 8.06172 7.5H5.15589V11.055H8.06089V20H11.6226V11.0558H14.4101L14.8526 7.50083H11.6217C11.7784 5.1475 10.9876 3.32083 13.3309 3.32083Z"

    </div>
</div>

</html>
